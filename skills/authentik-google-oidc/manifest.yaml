schemaVersion: 1
name: authentik-google-oidc
version: 1.1.0
description: Connect services to auth.shawnup.com using direct OIDC, Supabase Auth, Cloudflare Access, or an auth proxy.
tags:
  - authentik
  - oidc
  - oauth
  - google
  - identity
  - drive
  - sheets
  - security
  - supabase
  - cloudflare
entrypoint: SKILL.md
compatibility:
  - claude-code
  - codex
  - gemini-cli
  - custom
permissions:
  filesystem:
    read: true
    write: true
  shell: true
  network:
    - accounts.google.com
    - oauth2.googleapis.com
    - www.googleapis.com
    - sheets.googleapis.com
    - openidconnect.googleapis.com
    - docs.goauthentik.io
    - supabase.com
    - developers.cloudflare.com
    - auth.shawnup.com
requires:
  tools:
    - python3
owner: personal
verified: false
